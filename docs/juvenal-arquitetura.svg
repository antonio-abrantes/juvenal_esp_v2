<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">Juvenal — como tudo se conecta</title>
<desc id="desc">ESP32 detecta Juvenal, captura voz e reproduz áudio. Comunica-se com o servidor Python por WebSocket, enviando fala PCM16 e recebendo voz PCM16. O servidor transcreve, coordena o agente e sintetiza a resposta. Consulta o provedor de IA e executa chamadas HTTP às ferramentas opcionais, como Home Assistant. Visão do modo AUDIO_OUTPUT_MODE=esp32 e Home Assistant API.</desc>
